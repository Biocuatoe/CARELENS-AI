; CareLens AI firmware (ESP32-S3-WROOM N16R8 + OV5640 + MPU6050 + MAX98357A, chest-worn box).
; Board, memory, partition and USB settings are the ones verified with the known-good baseline build
; (docs/FIRMWARE_TOOLCHAIN.md §3, ADR-021): pioarduino 55.03.38-1 = Arduino-ESP32 3.3.8 / ESP-IDF libs 5.5.4.
; Build from PowerShell (not Git Bash) with PLATFORMIO_CORE_DIR=D:\AI\Cache\platformio; see README.md.
; The image contains no Wi-Fi password or device token (provisioned into NVS over UART0, tools/provision.py).

[platformio]
default_envs = carelens

[env:carelens]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.maximum_size = 3145728
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCARELENS_FW_VERSION=\"carelens-fw-0.2.0\"
    -Wall
build_src_filter = +<*> -<../test/>
upload_speed = 115200
monitor_speed = 115200
