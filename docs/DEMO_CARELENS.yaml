version: "1.0"
product: carelens
commands:
  - name: fall
    description: Simulate fall detection (care_level=7, warning)
    demo_method: emitCareEvent
    args:
      severity: warning
      careLevel: 7
      category: posture
      summary: "AI ghi nhận tư thế bất thường."
    expected_ui:
      - S04 alert badge increments
      - S05 timeline row with fall icon
      - Alert created with care_level=7
    related_ac: [AC04, AC05, AC06]

  - name: fall_high
    description: Critical fall (care_level=9, critical)
    demo_method: emitCareEvent
    args:
      severity: critical
      careLevel: 9
      category: posture
      summary: "Phát hiện té ngã nghiêm trọng."
    expected_ui:
      - S04 alert badge (high priority)
      - S05 critical timeline row
    related_ac: [AC04]

  - name: fall_no_ai
    description: Fall with low care level (below alert threshold)
    demo_method: emitCareEvent
    args:
      severity: info
      careLevel: 3
      category: posture
      summary: "Phát hiện chuyển động nhanh, không có té ngã."
    expected_ui:
      - S05 timeline event logged
      - No alert created
    related_ac: [AC04]

  - name: hub_off
    description: Hub disconnects
    demo_method: toggleHubConnection
    args:
      action: disconnect
    expected_ui:
      - S02 source shows "disconnected"
      - S08 hub status "offline"
    related_ac: [AC07]

  - name: hub_on
    description: Hub reconnects
    demo_method: toggleHubConnection
    args:
      action: connect
    expected_ui:
      - S02 source shows "connected"
      - S08 hub status "online"
    related_ac: [AC07]

  - name: frame_leak
    description: Attempt to access frame data (blocked)
    expected_behavior:
      - Frame data never sent to backend
      - Logged as blocked privacy violation
      - No UI impact
    related_ac: [AC16]

  - name: face_id
    description: Attempt face recognition (blocked)
    expected_behavior:
      - Face ID not performed
      - Logged as blocked privacy violation
      - No UI impact
    related_ac: [AC16]

  - name: stage_carelens
    description: Setup demo state for CareLens showcase
    expected_ui:
      - Hub connected
      - 24 hours of simulated events
      - Sample alerts at various stages

pitch_timing:
  overview: 30s
  fall_demo: 60s
  hub_demo: 30s
  wrapup: 30s
  total: ~2.5min
