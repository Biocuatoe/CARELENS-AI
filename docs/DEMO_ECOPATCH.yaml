version: "1.0"
product: ecopatch
commands:
  - name: vitals
    description: Send normal heart rate measurement
    demo_method: ingestMeasurement
    args:
      value: 72
      quality: good
      metric: heart_rate
      unit: bpm
    expected_ui:
      - S06 latest measurement updates to 72 bpm
      - S07 chart shows new data point
      - Source freshness indicator updates
    related_ac: [AC08]

  - name: vitals_late
    description: Send measurement that arrived late (55 minutes old)
    demo_method: ingestMeasurement
    args:
      value: 71
      quality: fair
      metric: heart_rate
      unit: bpm
      observedAt: "55_minutes_ago"
    expected_ui:
      - S06 "Late measurement" indicator
      - S07 gap in chart with late data point
      - Latest measurement unchanged
    related_ac: [AC08]

  - name: vitals_gap
    description: Create data gap then send measurements
    demo_method: ingestMeasurement
    args:
      gap_duration: 30
      measurements_before: 3
      measurements_after: 3
    expected_ui:
      - S07 chart shows break at gap
      - "Gap in data" indicator
      - Legend notes discontinuity
    related_ac: [AC08]

  - name: patch_replace
    description: Open patch replacement form
    expected_ui:
      - S09 form opens
      - Core device pre-selected
      - Current date/time pre-filled
      - Expected replacement date (7 days)
    related_ac: [AC10]

  - name: patch_idempotent
    description: Test idempotent patch replacement
    demo_method: replacePatch
    args:
      idempotency_key: "test-patch-001"
      repeat: 2
    expected_ui:
      - Only one patch session created
      - Second request returns existing session
      - No duplicate history entries
    related_ac: [AC10]

  - name: gsr_hydration
    description: Attempt GSR hydration claim (BLOCKED)
    blocked: true
    reason: "GSR is not hydration level. No hydration metric is available."
    expected_response: "Error: GSR is not hydration level. AC14: Hydration prediction not implemented."
    related_ac: [AC14]

  - name: stage_ecopatch
    description: Setup demo state for EcoPatch showcase
    expected_ui:
      - Core device connected
      - 24 hours of simulated measurements
      - Sample patch sessions

pitch_timing:
  overview: 30s
  vitals_demo: 45s
  late_demo: 30s
  patch_demo: 45s
  wrapup: 30s
  total: ~3min

guardrails:
  - id: AC14
    rule: "GSR is not hydration or electrolyte level"
    enforcement: command_blocked
    message: "GSR is not hydration level. No hydration metric is available."
  - id: AC14
    rule: "No hydration prediction"
    enforcement: schema_validation
    message: "Hydration metric not defined in contract"
