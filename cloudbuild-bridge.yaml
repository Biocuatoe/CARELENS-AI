steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/carelens-demo-bridge:$SHORT_SHA',
           '-f', 'backend/services/demo-bridge/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carelens-demo-bridge:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - carelens-demo-bridge
      - --image=gcr.io/$PROJECT_ID/carelens-demo-bridge:$SHORT_SHA
      - --region=asia-southeast1
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=3
      - --set-env-vars=BRIDGE_MODE=polling,TELEGRAM_ALLOWED_CHAT_ID=$_TELEGRAM_ALLOWED_CHAT_ID,WEB_ORIGIN=https://carelens-demo-web-$SHORT_SHA.a.run.app,SM_ENABLED=$_SM_ENABLED
      - --update-secrets=TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest
timeout: 600s
