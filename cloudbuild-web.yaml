steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/carelens-demo-web:$SHORT_SHA',
           '-f', 'frontend/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carelens-demo-web:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - carelens-demo-web
      - --image=gcr.io/$PROJECT_ID/carelens-demo-web:$SHORT_SHA
      - --region=asia-southeast1
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=VITE_BRIDGE_PUBLIC_URL=https://carelens-demo-bridge-$SHORT_SHA.a.run.app/ws
